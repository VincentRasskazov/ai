<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customer Support</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #f1f5f9;
      --bubble-bot: #f8fafc;
      --bubble-user: #2563eb;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      color: var(--text);
    }

    /* Production Shell - Expands to fill whatever iframe container it is in */
    .chat-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Clean Header */
    .chat-header {
      background: var(--primary);
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-info h4 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    /* Message Feed */
    .chat-feed {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .bubble p { margin: 0 0 6px 0; }
    .bubble p:last-child { margin: 0; }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border: 1px solid #e2e8f0;
      border-radius: 14px 14px 14px 2px;
      color: var(--text);
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: #ffffff;
      border-radius: 14px 14px 2px 14px;
    }

    .bubble.error-msg {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    /* Footer / Input */
    .chat-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: #ffffff;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 3px 4px 3px 12px;
      align-items: center;
      transition: border-color 0.15s ease;
    }

    .input-row:focus-within {
      border-color: var(--primary);
      background: #ffffff;
    }

    .input-row input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      color: var(--text);
      padding: 6px 0;
    }

    .input-row button {
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      transition: background 0.15s;
    }

    .input-row button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .input-row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .powered-by {
      font-size: 10px;
      text-align: center;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="chat-shell">
  <div class="chat-header">
    <div class="header-info">
      <h4 id="client-name">Live Support</h4>
      <div class="status-indicator">
        <span class="dot"></span>
        <span>Online</span>
      </div>
    </div>
  </div>

  <div class="chat-feed" id="chat-feed"></div>

  <div class="chat-footer">
    <form class="input-row" id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" required />
      <button type="submit" id="send-btn" aria-label="Send">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </form>
    <div class="powered-by">Powered by Vincent AI</div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const CLIENT_ID = params.get('client');
  const CONVERSATION_ID = 'prod_' + Math.random().toString(36).substr(2, 9);
  
  const feed = document.getElementById('chat-feed');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const form = document.getElementById('chat-form');
  const history = [];

  function addMessage(text, role, isError = false) {
    const el = document.createElement('div');
    el.className = `bubble ${role} ${isError ? 'error-msg' : ''}`;
    el.innerHTML = role === 'bot' ? marked.parse(text) : text;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
    return el;
  }

  if (!CLIENT_ID) {
    addMessage("Integration error: No client account loaded.", "bot", true);
    input.disabled = true;
    sendBtn.disabled = true;
  } else {
    const title = CLIENT_ID.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
    document.getElementById('client-name').innerText = title;
    addMessage(`Hello! Welcome to ${title}. How can we assist you today?`, 'bot');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    addMessage(query, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const botMsgEl = addMessage('...', 'bot');
    let responseText = '';

    try {
      const res = await fetch('https://backendai-ablv.onrender.com/b2b/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_id: CLIENT_ID,
          conversation_id: CONVERSATION_ID,
          message: query,
          history: history,
          mode: 'prod' // Production mode strictly requests Gemini API Key
        })
      });

      if (res.status === 402) throw new Error('KEY_MISSING');
      if (res.status === 403) throw new Error('ACCOUNT_INACTIVE');
      if (!res.ok) throw new Error('SERVER_ERROR');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      botMsgEl.innerHTML = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        responseText += decoder.decode(value, { stream: true });
        botMsgEl.innerHTML = marked.parse(responseText);
        feed.scrollTop = feed.scrollHeight;
      }

      history.push({ role: 'user', content: query });
      history.push({ role: 'assistant', content: responseText });

    } catch (err) {
      botMsgEl.classList.add('error-msg');
      if (err.message === 'KEY_MISSING') {
        botMsgEl.innerText = "Support service unavailable: Production license key required.";
      } else if (err.message === 'ACCOUNT_INACTIVE') {
        botMsgEl.innerText = "This chat service is currently offline.";
      } else {
        botMsgEl.innerText = "Connection lost. Please try again shortly.";
      }
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
